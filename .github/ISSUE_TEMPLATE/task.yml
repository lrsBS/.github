name: 📋 Task
description: A concrete piece of work that needs to be done
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be achieved when this task is done?
      placeholder: |
        Set up ... so that ...
    validations:
      required: true
  - type: textarea
    id: subtasks
    attributes:
      label: Subtasks
      placeholder: |
        - [ ] Step 1
        - [ ] Step 2
        - [ ] Step 3
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The task is done when ...
      placeholder: |
        - [ ] Tests pass
        - [ ] Documentation updated
